name: Publish

# Publishes @supcoflow/chat to npm when a tag `v*` is pushed.
# Trusted publishing (OIDC): no npm token and no secret in this repository. npm checks that this exact
# workflow file, in this repository, is the publisher registered for the package, and signs the build
# provenance (sigstore), which needs the repository to be public.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # what npm uses to verify the trusted publisher and to sign the provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1; Node 24 ships it, and this leaves it written down.
      - run: npm -v

      - name: the tag matches the package version, is not a prerelease, and is on main
        run: |
          VERSION=$(node -p "require('./package.json').version")
          test "v$VERSION" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != v$VERSION"; exit 1; }
          case "$VERSION" in *-*) echo "$VERSION is a prerelease and would be published as latest: not publishing"; exit 1;; esac
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main || { echo "the tagged commit is not on main"; exit 1; }

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - run: npm publish --access public --provenance
